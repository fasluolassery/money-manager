name: Task
description: A unit of work from the backlog
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists. Link the relevant SPEC.md rules, DESIGN.md sections and UI.md sections.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this task includes.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements that must all be true for the task to be accepted.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this task deliberately does not include.
  - type: textarea
    id: traceability
    attributes:
      label: Traceability
      description: Requirement IDs this implements (FR-…, from SPEC.md) and decision IDs it follows (D-…). Write "none" if it implements no requirement. Add the issue to tools/backlog/issues.md too.
      value: |
        - Implements:
        - Decisions:
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be done first, e.g. "Blocked by #3".
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      description: DESIGN.md Section 10.5
      options:
        - label: All acceptance criteria are met
        - label: Tests required by Spec Rule 16 for this area are written and pass
        - label: Every CI gate passes
        - label: Works on a phone-sized and a laptop-sized screen (UI tasks)
        - label: Matches UI.md, including tokens, states, motion, copy and the accessibility baseline (UI tasks)
        - label: Errors are handled as in DESIGN.md Section 9; no third-party error text reaches the user (9.6)
        - label: The code rules and import boundaries in DESIGN.md 10.4 pass
        - label: API responses go through their response schemas, with no internal fields (DESIGN.md 6.6)
        - label: Names follow DESIGN.md 10.9 and the glossary; any new dependency is justified (10.10)
        - label: Tests carry the requirement IDs they prove (DESIGN.md 10.8), and TRACEABILITY.md is regenerated
        - label: No decision (D-…) was changed silently
        - label: SPEC.md / DESIGN.md / UI.md updated if behaviour or design changed
        - label: Merged through a squash-merged pull request that closes this issue
