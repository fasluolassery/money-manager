changelog:
  categories:
    - title: Features
      labels: ["type: feature"]
    - title: Bug fixes
      labels: ["type: bug"]
    - title: Infrastructure
      labels: ["type: infra"]
    - title: Tests
      labels: ["type: test"]
    - title: Documentation
      labels: ["type: docs"]
    - title: Maintenance
      labels: ["type: chore"]
    - title: Other changes
      labels: ["*"]
