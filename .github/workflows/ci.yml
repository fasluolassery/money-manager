name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Docs and traceability
        run: pnpm docs:check

      - name: Issues match the backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm backlog:verify

      - name: Pull request record
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm pr:check

      - name: Import boundaries
        run: pnpm check:boundaries

      - name: Code duplication
        run: pnpm check:duplication

      - name: Discipline checks
        run: pnpm check:discipline

      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Token check
        run: pnpm check:tokens

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: API tests
        run: pnpm test:api

      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm build

      - name: Size limit
        run: pnpm --filter @money-manager/web size

      - name: OpenAPI up to date
        run: |
          pnpm gen:openapi
          git diff --exit-code docs/openapi.json

      - name: No inline scripts in built output
        run: |
          node -e "
            const html = require('fs').readFileSync('apps/web/dist/index.html', 'utf8');
            if (/<script(?![^>]*\bsrc\s*=)[^>]*>\s*\S/i.test(html)) {
              console.error('inline script found in dist/index.html'); process.exit(1);
            }
            console.log('OK: no inline scripts');
          "

      - name: PWA assets in built output
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('apps/web/dist/manifest.webmanifest', 'utf8'));
            if (manifest.name !== 'Money Manager') { console.error('manifest.name wrong'); process.exit(1); }
            if (manifest.short_name !== 'MoneyMgr') { console.error('manifest.short_name wrong'); process.exit(1); }
            if (!Array.isArray(manifest.icons) || manifest.icons.length < 3) { console.error('icons missing'); process.exit(1); }
            if (!manifest.icons.some(i => i.purpose === 'maskable')) { console.error('maskable icon missing'); process.exit(1); }
            console.log('OK: manifest valid');
            const sw = fs.readFileSync('apps/web/dist/sw.js', 'utf8');
            // Workbox serialises /\/api\// with escaped slashes, so do not use includes('/api/').
            if (!/api[\s\S]*NetworkOnly/.test(sw)) { console.error('SW missing NetworkOnly rule for /api/'); process.exit(1); }
            console.log('OK: service worker routes /api to NetworkOnly');
          "
